[build]
dockerfilePath = "docker/Dockerfile.backend.prod"

[deploy]
startCommand = "uvicorn coform.main:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "coform-backend"
