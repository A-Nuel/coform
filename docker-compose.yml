version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./packages/backend:/app/packages/backend
    environment:
      - COFORM_ENV=development
    command: uvicorn coform.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "5173:5173"
    volumes:
      - ./packages/frontend:/app/packages/frontend
      - ./packages/core:/app/packages/core
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
